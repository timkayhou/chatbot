[project]
name = "local-support-workbench"
version = "0.1.0"
description = "Offline-first customer support drafting workbench"
requires-python = ">=3.12"

[project.optional-dependencies]
media = [
  "onnxruntime>=1.31,<2",
  "opencv-python-headless>=5,<6",
  "rapidocr>=3.10,<4",
]
test = [
  "qrcode[pil]>=8,<9",
]

[project.scripts]
support-workbench = "workbench.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]

