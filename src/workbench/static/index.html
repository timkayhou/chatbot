<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>本地客服工作台</title>
  <style>
    :root{font-family:Inter,"Segoe UI",system-ui,sans-serif;color:#172033;background:#eef2f8}*{box-sizing:border-box}body{max-width:1120px;margin:28px auto;padding:0 20px}main,.panel{background:white;padding:28px;border:1px solid #e1e6ef;border-radius:18px;box-shadow:0 12px 40px #1d2b4b12}.panel{margin-bottom:20px}h1{margin:0 0 6px;font-size:30px}h2{margin:0 0 18px;font-size:21px}.subtitle{color:#61708a;margin:0 0 22px}.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.badge{display:inline-block;background:#fff3cd;color:#6b4d00;padding:7px 11px;border-radius:99px;font-weight:650;white-space:nowrap}.badge.danger{background:#ffe8e6;color:#9a2d20}.badge.good{background:#dcf7e8;color:#12603a}.overview{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:14px;margin-bottom:18px}.metric{padding:17px;border-radius:14px;background:#f5f7fb;border:1px solid #e4e8f0}.metric strong{display:block;font-size:25px;margin-top:7px}.metric small{color:#68758b}.progress{height:10px;background:#e5e9f1;border-radius:99px;overflow:hidden;margin-top:12px}.progress span{display:block;height:100%;background:#3769e8}.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.status-card{padding:15px;border:1px solid #e2e7f0;border-radius:13px}.status-card .state{font-size:12px;font-weight:750;text-transform:uppercase}.status-card.ready,.status-card.passed{border-color:#a9dfc1;background:#f2fbf6}.status-card.running{border-color:#9ec0ff;background:#f3f7ff}.status-card.todo,.status-card.offline,.status-card.attention{border-color:#efc5ac;background:#fff8f3}.status-card.failed{border-color:#efa8a0;background:#fff0ef;color:#8f241b}.status-card p{font-weight:700;margin:7px 0 5px}.status-card small{color:#637087;line-height:1.4}.toolbar{display:flex;gap:10px;margin-top:18px}.section-note{padding:12px 14px;border-left:4px solid #e5a22f;background:#fff8e9;color:#604614;margin-bottom:20px}label{display:block;margin:18px 0 7px;font-weight:650}textarea,input,select{width:100%;padding:11px;border:1px solid #bac2d0;border-radius:8px;font:inherit}textarea{min-height:120px;resize:vertical}.row{display:grid;grid-template-columns:2fr 1fr;gap:12px}.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}button{padding:10px 15px;border:0;border-radius:8px;background:#2257d6;color:white;font-weight:650;cursor:pointer}button.secondary{background:#e8edf8;color:#20345c}button:disabled{opacity:.5;cursor:not-allowed}#status{margin-top:18px;padding:12px;background:#eef2f9;border-radius:8px;white-space:pre-wrap}@media(max-width:760px){.overview,.status-grid{grid-template-columns:1fr}.topline{display:block}.badge{margin-top:10px}.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<section class="panel">
  <div class="topline"><div><h1>本地客服运行中心</h1><p class="subtitle">实时显示能否运行、正在验证什么，以及距离正式启用还差哪些。</p></div><span id="formalBadge" class="badge danger">尚未正式就绪</span></div>
  <div class="overview">
    <div class="metric"><small>整体准备度</small><strong id="readinessCount">正在读取…</strong><div class="progress"><span id="readinessBar" style="width:0"></span></div></div>
    <div class="metric"><small>本地 AI 通信</small><strong id="aiState">检测中</strong></div>
    <div class="metric"><small>稳定性测试</small><strong id="soakState">检测中</strong><small id="soakDetail"></small></div>
  </div>
  <div id="statusGrid" class="status-grid"></div>
  <div class="toolbar"><button id="refreshStatus" class="secondary">刷新状态</button><button id="testInference">立即测试 AI 通信</button></div>
  <div id="probeResult" class="section-note" style="margin-top:18px">状态页只进行本机读取，不会发送客户数据。</div>
</section>
<main>
  <div class="topline"><div><h2>人工发送工作台</h2><p class="subtitle">当前可用流程：粘贴客户消息、人工编辑草稿、安全校验、批准并复制。</p></div><span class="badge">手动模式 · 不会自动发送</span></div>
  <div class="section-note">AI 只生成草稿，仍需人工编辑、校验和批准；系统不会自动发送。</div>
  <div class="row"><div><label for="label">会话标签</label><input id="label" value="手动会话"></div><div><label for="language">回复语言</label><select id="language"><option>zh-CN</option><option>zh-TW</option><option>ja</option><option>en</option></select></div></div>
  <label for="inbound">客户消息（粘贴）</label><textarea id="inbound"></textarea>
  <label for="draft">回复草稿（人工编辑）</label><textarea id="draft"></textarea>
  <label for="media">待发送图片（可选，离线检查文字和二维码）</label><input id="media" type="file" accept="image/png,image/jpeg,image/webp,image/bmp">
  <div class="actions"><button id="suggest" class="secondary">AI 生成草稿</button><button id="create">建立草稿</button><button id="analyze" class="secondary" disabled>分析图片</button><button id="check" class="secondary" disabled>运行校验</button><button id="approve" disabled>批准</button><button id="copy" disabled>复制给人工发送</button></div>
  <div id="status">等待粘贴消息。所有内容只写入本机数据库。</div>
</main><script>
let id=null; const $=x=>document.getElementById(x); async function post(path,data={}){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw new Error(j.error||r.statusText);return j} async function getJSON(path){const r=await fetch(path);const j=await r.json();if(!r.ok)throw new Error(j.error||r.statusText);return j}
const stateNames={ready:'就绪',passed:'通过',running:'进行中',failed:'失败',todo:'待完成',offline:'离线',attention:'需检查',not_started:'未开始',starting:'启动中'};
async function loadStatus(){try{const data=await getJSON('/api/status');const r=data.readiness,s=data.soak;$('readinessCount').textContent=`${r.ready_count} / ${r.total_count}`;$('readinessBar').style.width=`${Math.round(100*r.ready_count/r.total_count)}%`;$('aiState').textContent=stateNames[data.inference.state]||data.inference.state;$('soakState').textContent=stateNames[s.state]||s.state;$('soakDetail').textContent=`${s.runs} 次请求 · ${s.failures} 次失败`;$('statusGrid').innerHTML=r.items.map(item=>`<article class="status-card ${item.state}"><span class="state">${stateNames[item.state]||item.state}</span><p>${item.label}</p><small>${item.detail}</small></article>`).join('');}catch(e){$('probeResult').textContent=`状态读取失败：${e.message}`}}
$('refreshStatus').onclick=loadStatus;$('testInference').onclick=async()=>{const button=$('testInference');button.disabled=true;$('probeResult').textContent='正在运行本地 AI 通信测试…';try{const r=await post('/api/system/inference-test');$('probeResult').textContent=`通信成功：${r.tokens} token，用时 ${r.seconds} 秒。`}catch(e){$('probeResult').textContent=`通信失败：${e.message}`}finally{button.disabled=false;loadStatus()}};loadStatus();setInterval(loadStatus,15000);
$('suggest').onclick=async()=>{const button=$('suggest');const inbound=$('inbound').value.trim();if(!inbound){$('status').textContent='请先粘贴客户消息，再让本地模型起草。';return}button.disabled=true;id=null;$('check').disabled=true;$('approve').disabled=true;$('copy').disabled=true;$('analyze').disabled=true;$('status').textContent='正在请求本地模型起草…';try{const r=await post('/api/suggest',{inbound,language:$('language').value});$('draft').value=r.draft;$('status').textContent=`草稿由本地模型生成（${r.tokens} token，用时 ${r.seconds} 秒），仍需人工修改、建立草稿、校验和批准。`}catch(e){$('status').textContent=`生成失败：${e.message}`}finally{button.disabled=false}};
$('create').onclick=async()=>{id=null;$('analyze').disabled=true;$('check').disabled=true;$('approve').disabled=true;$('copy').disabled=true;try{const r=await post('/api/work',{label:$('label').value,language:$('language').value,inbound:$('inbound').value,draft:$('draft').value});id=r.id;$('check').disabled=false;$('analyze').disabled=!$('media').files.length;$('status').textContent=`草稿 #${id} 已保存；当前为手动模式。请先校验。`}catch(e){$('status').textContent=e.message}}
$('media').onchange=()=>{$('analyze').disabled=!id||!$('media').files.length}
$('analyze').onclick=async()=>{try{const file=$('media').files[0];if(!file)throw new Error('请先选择图片');const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)});const r=await post(`/api/drafts/${id}/media`,{filename:file.name,content:data});$('status').textContent=`图片已离线分析：${r.width}×${r.height}，识别文字 ${r.extracted_text.length} 条，二维码 ${r.qr_payloads.length} 个。请运行校验。`; $('approve').disabled=true}catch(e){$('status').textContent=e.message}}
$('check').onclick=async()=>{try{const r=await post(`/api/drafts/${id}/check`);$('approve').disabled=r.verdict!=='pass';$('status').textContent=r.verdict==='pass'?'校验通过，可以批准。':`已拦截：${r.hits.map(x=>x.rule).join(', ')}`}catch(e){$('status').textContent=e.message}}
$('approve').onclick=async()=>{try{await post(`/api/drafts/${id}/approve`,{revision:1});$('copy').disabled=false;$('approve').disabled=true;$('status').textContent='已批准。仍未发送；请复制后在官方界面人工确认。'}catch(e){$('status').textContent=e.message}}
$('copy').onclick=async()=>{try{const r=await post(`/api/drafts/${id}/copy`);await navigator.clipboard.writeText(r.body);$('status').textContent='已复制到剪贴板。系统未标记为已发送，请在官方界面人工发送。'}catch(e){$('status').textContent=e.message}}
</script></body></html>
